# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
# 网站标题
title: 阅界
# 网站副标题
subtitle: 观万象，察新知
# 网站描述
description: 阅无界，知天下。这里聚焦科技数码前沿，漫谈历史风云，记录旅行时光，品味小说人生，共话民生热点。
# 网站关键词
keywords: 科技, 数码, 历史, 旅游, 小说, 民生, 热点
# 网站作者
author: 阅界
# 网站语言
language: zh-CN
# 时区
timezone: Asia/Shanghai
seo_title: 阅界
project_dir: projects

# 用户设置
avatar: avatar.png

# Utteranc 评论系统
comment:
  repo: xrr2016/blog

# 社交平台链接：
sns:
  github: zhancat200801
  # juejin: 576666b7207703006b1e0f09

# # 博客访问数据
# track:
#   gaid: xxxxxxxxxxxxxx

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
# 网站根路径


# 网站的完整 URL
url: https://yuejie.site
root: /
# url: http://example.com
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# 归档页面每页显示的文章数量
archive_generator:
  per_page: 20 # 将数字改为你希望的数量
  yearly: true
  monthly: true

# 标签页面每页显示的文章数量
tag_generator:
  per_page: 10 # 将数字改为你希望的数量

# 分类页面每页显示的文章数量
category_generator:
  per_page: 10 # 将数字改为你希望的数量

# Search
search:
  insight: true # you need to install `hexo-generator-json-content` before using Insight Search
  swiftype: # enter swiftype install key here
  baidu: false # you need to disable other search engines to use Baidu search, options: true, false

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

auto_excerpt:
  enable: true
  length: 150

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
# theme: landscape
# theme: hexo-theme-artemisX
# theme: hexo-theme-next
theme: hexo-theme-cold-stone


# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: 'git'
  repo: git@github.com:zhancat200801/yuej.git
  branch: gh-pages

# 在 _config.yml 中
force_https: true

# Google Analytics Tracking (如果使用)
track:
  google_analytics:
    enable: false  # 如果您不使用Google分析，设为false
    gaid: ''       # 如果您使用，在此填入您的GA跟踪ID

# RSS
rss: true
feed:
  type: atom
  path: atom.xml
  limit: 20
  hub:
  content:
  content_limit: 140
  content_limit_delim: ' '
  order_by: -date
  icon: avatar.png
  autodiscovery: true

